name: security-check

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  security:
    runs-on: ubuntu-24.04
    timeout-minutes: 15

    # `prisma validate` and `prisma generate` resolve the datasource from the schema, so the
    # variable must exist even though neither opens a connection. No database service is
    # needed here: this workflow runs the unit tests, not the integration suite.
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/leadmelo_ci
      NEXT_TELEMETRY_DISABLED: 1

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      # `npm ci` deletes node_modules, including the generated Prisma client. Without this
      # step typecheck fails with ~86 errors (implicit any on every Prisma callback, and
      # missing Prisma namespace members) that are all artefacts, not real type problems.
      - name: Validate Prisma schema
        run: npm run db:validate

      - name: Generate Prisma client
        run: npm run db:generate

      - name: Type check
        run: npm run typecheck

      - name: Run tests
        run: npm test

      - name: Security audit
        run: npm audit --audit-level=high

      - name: Build
        run: npm run build